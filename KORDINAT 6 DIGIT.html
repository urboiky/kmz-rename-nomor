<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formatter 6 Digit Desimal</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #15803d;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 430px;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: Consolas, Monaco, monospace;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .primary:hover { background: var(--primary-hover); }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary:hover { background: #d1d5db; }

    .danger {
      background: #fee2e2;
      color: var(--danger);
    }

    .danger:hover { background: #fecaca; }

    .status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 14px;
      color: var(--success);
      font-weight: 700;
    }

    .info {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e3a8a;
      line-height: 1.5;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      textarea { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Formatter 6 Digit di Belakang Titik</h1>
      <p class="subtitle">
        Tempel data satu angka per baris. Angka yang kurang dari 6 digit desimal akan ditambahkan angka 0 di belakang.
      </p>

      <div class="grid">
        <div>
          <label for="inputData">Data awal</label>
          <textarea id="inputData" placeholder="Contoh:\n-6.22729\n106.74687\n106.746"></textarea>
        </div>

        <div>
          <label for="outputData">Hasil</label>
          <textarea id="outputData" readonly placeholder="Hasil akan muncul di sini"></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="convertBtn">Ubah ke 6 Digit</button>
        <button class="secondary" id="copyBtn">Copy Hasil</button>
        <button class="secondary" id="downloadBtn">Download TXT</button>
        <button class="danger" id="clearBtn">Hapus Semua</button>
      </div>

      <div class="status" id="status"></div>

      <div class="info">
        Contoh: <b>-6.22729</b> menjadi <b>-6.227290</b>,
        <b>106.746</b> menjadi <b>106.746000</b>.
        Data yang sudah memiliki 6 digit desimal tidak diubah.
      </div>
    </section>
  </main>

  <script>
    const inputData = document.getElementById('inputData');
    const outputData = document.getElementById('outputData');
    const status = document.getElementById('status');

    function formatSixDecimals(value) {
      const text = value.trim();
      if (!text) return '';

      if (!/^[+-]?\d+(\.\d+)?$/.test(text)) {
        return text;
      }

      const parts = text.split('.');
      const integerPart = parts[0];
      const decimalPart = parts[1] || '';

      if (decimalPart.length >= 6) {
        return integerPart + '.' + decimalPart.slice(0, 6);
      }

      return integerPart + '.' + decimalPart.padEnd(6, '0');
    }

    function convertData() {
      const lines = inputData.value.split(/\r?\n/);
      const output = lines.map(formatSixDecimals).join('\n');
      outputData.value = output;

      const filledLines = lines.filter(line => line.trim() !== '').length;
      status.textContent = `${filledLines} baris berhasil diproses.`;
    }

    async function copyOutput() {
      if (!outputData.value) {
        status.textContent = 'Belum ada hasil untuk disalin.';
        return;
      }

      try {
        await navigator.clipboard.writeText(outputData.value);
        status.textContent = 'Hasil berhasil dicopy.';
      } catch {
        outputData.select();
        document.execCommand('copy');
        status.textContent = 'Hasil berhasil dicopy.';
      }
    }

    function downloadTxt() {
      if (!outputData.value) {
        status.textContent = 'Belum ada hasil untuk didownload.';
        return;
      }

      const blob = new Blob([outputData.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'hasil_6_digit.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      status.textContent = 'File TXT berhasil didownload.';
    }

    function clearAll() {
      inputData.value = '';
      outputData.value = '';
      status.textContent = '';
      inputData.focus();
    }

    document.getElementById('convertBtn').addEventListener('click', convertData);
    document.getElementById('copyBtn').addEventListener('click', copyOutput);
    document.getElementById('downloadBtn').addEventListener('click', downloadTxt);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
  </script>
</body>
</html>
